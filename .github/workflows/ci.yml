name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (Postgres uniquement)
        # Fournit l'instance Postgres locale (127.0.0.1:54322) avec le schéma `auth`.
        # -x : on exclut tous les services non-DB pour accélérer le démarrage en CI.
        run: supabase start -x studio,imgproxy,inbucket,realtime,storage,edge-runtime,functions,vector,analytics,kong,rest,meta

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test = test:unit (sans DB) + test:db (base de test dédiée créée par scripts/test-db.sh).
      # Les tests d'intégration créent leurs propres données ; pas de seed (Photon = réseau).
      - name: Run tests (unit + db)
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder"
      SUPABASE_SECRET_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
